name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EnyaqTube.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EnyaqTube-apk
          path: EnyaqTube.apk

      # Aktuelle Version zusätzlich als Release "latest" veröffentlichen,
      # damit man die APK direkt auf dem Handy herunterladen kann.
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: EnyaqTube (neueste Version)
          prerelease: true
          files: EnyaqTube.apk
          body: |
            Automatisch gebaut aus ${{ github.sha }} (Branch ${{ github.ref_name }}).
            Installation: siehe README.
